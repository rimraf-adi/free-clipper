[project]
name = "clipper"
version = "0.2.0"
description = "Automated Video Clipping Agent — CLI + Web UI — powered by Groq LLM, local Whisper, and FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=1.5.0",
    "python-dotenv>=1.2.2",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2026.7.4",
    "pydub>=0.25.1",
    "pyyaml>=6.0.3",
    "pillow>=10.0.0",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic>=2",
    "requests",
    "indic-transliteration",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
